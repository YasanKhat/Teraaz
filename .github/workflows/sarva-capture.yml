name: Capture public Sarva pages
on:
  push:
    branches: [arena/3c4e6c63-teraaz]
    paths: ['.github/workflows/sarva-capture.yml', 'tools/sarva-capture/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --prefix "$RUNNER_TEMP/capture-deps" playwright@1.56.1
      - name: Install browser
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/capture-deps/node_modules/.bin/playwright" install --with-deps chromium 2>&1 | tee /tmp/sarva-browser-install.log || {
            tail -15 /tmp/sarva-browser-install.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Capture anonymous public pages
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/capture-deps/node_modules/playwright
        run: |
          node tools/sarva-capture/capture.cjs
          node -e 'const m=require("./sarva-capture-output/manifest.json"); for(const r of m.routes) console.log(`::notice::${r.route} status=${r.status} title=${r.title} resources=${r.responses.length} errors=${r.errors.length}`); console.log(`::notice::total unique resources=${Object.keys(m.resources).length}`)' 
      - name: Make public capture readable through Git objects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/sarva-capture/publish-blobs.cjs
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarva-public-capture
          path: sarva-capture-output/
          if-no-files-found: error
          retention-days: 3
  browser-libs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser libraries for local preview checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          files=()
          for lib in libnspr4.so libplc4.so libplds4.so libnss3.so libnssutil3.so libsmime3.so libssl3.so libsoftokn3.so libfreebl3.so; do
            if [ -e "/usr/lib/x86_64-linux-gnu/$lib" ]; then files+=("$lib"); else echo "::notice::Missing optional $lib"; fi
          done
          tar -czhf "$RUNNER_TEMP/browser-libs.tar.gz" -C /usr/lib/x86_64-linux-gnu "${files[@]}"
          node tools/sarva-capture/publish-local-libs.cjs "$RUNNER_TEMP/browser-libs.tar.gz"
