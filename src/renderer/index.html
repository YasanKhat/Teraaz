<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>تبار — تاریخ ۲، پایهٔ یازدهم</title>
    <script>
      // پوستهٔ ذخیره‌شده را پیش از بارگذاری React اعمال می‌کنیم تا پرش رنگ نداشته باشیم.
      try {
        const raw = localStorage.getItem('tabar-history-v1')
        if (raw) {
          const theme = JSON.parse(raw)?.state?.settings?.theme
          const motion = JSON.parse(raw)?.state?.settings?.motion
          if (theme) document.documentElement.dataset.theme = theme
          if (motion === false) document.documentElement.dataset.motion = 'off'
        }
      } catch (error) {}
    </script>
    <meta
      name="description"
      content="تبار — همراهِ کاملِ درس تاریخ ۲ پایهٔ یازدهم انسانی: درس‌نامه‌های روایی، خط زمان تعاملی، نقشهٔ تاریخی، چهره‌ها، کارت‌های مرور فاصله‌دار و آزمون‌های شبیه‌ساز امتحان نهایی."
    />
    <meta name="theme-color" content="#050913" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23050913'/%3E%3Cpath d='M32 8l5.2 18.8L56 32l-18.8 5.2L32 56l-5.2-18.8L8 32l18.8-5.2z' fill='none' stroke='%23E6BF73' stroke-width='1.8'/%3E%3Ccircle cx='32' cy='32' r='5' fill='none' stroke='%23E6BF73' stroke-width='1.4'/%3E%3Ccircle cx='32' cy='32' r='1.6' fill='%23E6BF73'/%3E%3C/svg%3E"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: http: https:;"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
